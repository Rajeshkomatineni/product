name: Build FoodDeal Android Install Test
on:
  workflow_dispatch:
  push:
    paths:
      - "fooddeal-android/**"
      - ".github/workflows/build-fooddeal-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RELEASE_STORE_PASSWORD: fooddeal-build-only
      RELEASE_KEY_PASSWORD: fooddeal-build-only
      RELEASE_KEY_ALIAS: fooddeal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Create temporary signing key
        run: |
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/fooddeal-release.jks"             -storepass "$RELEASE_STORE_PASSWORD"             -alias "$RELEASE_KEY_ALIAS"             -keypass "$RELEASE_KEY_PASSWORD"             -keyalg RSA -keysize 2048 -validity 3650             -dname "CN=FoodDeal, OU=Mobile, O=FoodDeal, L=Hyderabad, ST=Telangana, C=IN"
      - name: Build signed release APK
        working-directory: fooddeal-android
        run: |
          gradle --no-daemon :app:assembleRelease             -PRELEASE_STORE_FILE="$RUNNER_TEMP/fooddeal-release.jks"             -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"             -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"             -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose fooddeal-android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FoodDeal-Install-Test-v1.0.3
          path: fooddeal-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
